<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript Calculator</title>
    <style>
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="calculator">
      <h2>Калькулятор стоимости услуги</h2>

      <label for="quantity">Количество:</label>
      <input type="number" min="1" value="1" id="quantity" /><br /><br />

      <div>
        <p>Тип услуги:</p>
        <label
          ><input type="radio" name="serviceType" value="type1" checked /> Тип
          1</label
        ><br />
        <label
          ><input type="radio" name="serviceType" value="type2" /> Тип 2</label
        ><br />
        <label
          ><input type="radio" name="serviceType" value="type3" /> Тип 3</label
        ><br />
      </div>

      <select class="options hidden" id="optionsSelect"></select>
      <label class="propertyLabel hidden">
        <input type="checkbox" id="hasProperty" />Дополнительная услуга
      </label>

      <p>Итоговая стоимость: <span id="totalPrice">0 руб.</span></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
