<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="generator" content="GitLab Pages" />
    <title>Plain HTML site using GitLab Pages</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div id="prodPrice">Выберите тип товара</div>
    <label>Тип товара:</label>
    <form>
      <select name="prodType">
        <option value="1">Product 1</option>
        <option value="2">Product 2</option>
        <option value="3">Product 3</option>
      </select>
      <div id="radios">
        <label
          ><input type="radio" name="prodOptions" value="option1" /> Опция
          1</label
        >
        <label
          ><input type="radio" name="prodOptions" value="option2" /> Опция
          2</label
        >
      </div>
      <div id="checkboxes">
        <label><input type="checkbox" name="prop1" /> Свойство 1</label>
        <label><input type="checkbox" name="prop2" /> Свойство 2</label>
      </div>
    </form>
    <div class="form-group">
      <label for="quantity">Количество товара:</label>
      <input type="number" id="quantity" min="1" value="1" />
      <div class="error" id="quantityError">
        Введите корректное количество (минимум 1)
      </div>
    </div>

    <div class="result" id="result">
      <strong>Стоимость заказа: <span id="totalPrice">0</span> руб.</strong>
    </div>
  </body>
</html>
